name: Refresh Cargo lock

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.head_commit.message == 'ci: temporarily refresh migrated dependency lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.5
        with:
          buildtargets: esp32s3
      - run: cargo +esp generate-lockfile
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: refresh lockfile after espbewi migration"
          git push origin HEAD:main
