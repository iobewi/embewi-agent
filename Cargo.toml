[package]
edition      = "2024"
name         = "embewi-agent-esp"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "embewi-agent-esp"
path = "./src/bin/main.rs"

[[bin]]
name = "embewi-init"
path = "./src/bin/init.rs"

[features]
# TEST/DEBUG ONLY -- never enable in a production image. Makes the
# pending_verify self-check reset the device right after it passes but
# BEFORE confirming (`ota.rs`'s `confirm_pending`), deterministically
# exercising embewi-boot's `Pending -> Aborted -> fallback` rollback path
# without needing to time a physical power-cut against a live self-check
# window (which normally completes before Wi-Fi even reconnects).
fault-injection = []
# TEST/DEBUG ONLY -- never enable in a production image. A stronger variant
# of `fault-injection`: instead of a clean `software_reset()` after the
# self-check passes, spins forever right at the top of `confirm_pending`,
# starving the whole (single-threaded) embassy executor before either the
# self-check or its own software deadline ever gets polled again -- the one
# failure a purely software timeout structurally cannot catch, since it
# depends on the same stuck executor. Proves the *hardware* watchdog alone
# forces the eventual reset, with zero cooperation from any of this
# firmware's own code.
fault-injection-freeze = []

[dependencies]
# IOBEWI transactional OTA service and ESP backend. Also carries the
# first-install bootstrap lifecycle (`iobewi_ota::bootstrap`) -- no longer a
# separately-pinned alias: `iobewi-esp`'s OTA adapter now depends on this
# same rev's bootstrap module itself, so keeping the main engine on an
# older rev would just reintroduce the exact cross-version trait mismatch
# this single dependency avoids.
iobewi-ota = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39", features = ["http", "runtime", "config-space"] }
iobewi-http = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39" }
# Portable "TLS before HTTP dispatch" capability consumed by http/mod.rs's
# serve() helper; part of the same connected component as iobewi-http above.
iobewi-https = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39" }
iobewi-tls = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39", features = ["http"] }
iobewi-wifi = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39" }
# Local log capture (ring + the single global logger); the WebSocket streaming below sits on top of it.
iobewi-log = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39" }
iobewi-log-stream = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39" }
iobewi-ntp = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39" }
# Low-level connection contracts (Close, Connection, outbound Connector) and
# the secure-outbound-connector guarantee (SecureClientTransport). iobewi-esp-tls
# implements both; heartbeat and log-stream consume them.
iobewi-net-io = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39" }
iobewi-net-tls-core = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39" }
# Portable device-status capability (semantic state only, no LED/colour).
iobewi-indicator = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39" }
# Portable runtime diagnostics capability (stack headroom, etc.).
iobewi-runtime = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39" }
# Portable platform capabilities consumed by Embewi business logic.
iobewi-device = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39" }
iobewi-entropy = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39" }
# Transport-agnostic Improv Serial codec/parser extracted from this firmware.
# Pinned by commit while its API is still pre-stable.
improv-serial = { git = "https://github.com/iobewi/improv-serial", rev = "8e9d2c4" }
# One process-wide physical flash owner. No NVS or OTA semantics live here.
# Pinned alongside https/tls/config-space/log-stream below: all share path
# dependencies inside iobewi-esp (https->http->..., ->tls->config-space->
# flash, ota->config-space->flash), so every consumer must resolve the same
# rev or Cargo instantiates two structurally-identical-but-incompatible copies.
iobewi-esp-flash = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39", package = "iobewi-esp-flash", features = ["esp32s3"] }
iobewi-esp-ota = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39", package = "iobewi-esp-ota", features = ["esp32s3", "shared-flash"] }
# ESP radio implementation for the portable IOBEWI Wi-Fi service.
iobewi-esp-wifi = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39", package = "iobewi-esp-wifi", features = ["esp32s3"] }
iobewi-esp-log-stream = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39", features = ["esp32s3"] }
# ESP console sink handed to iobewi_log::install.
iobewi-esp-console = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39", features = ["esp32s3"] }
# ESP RMT/WS2812 renderer for the portable status-indicator capability.
iobewi-esp-indicator = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39", features = ["esp32s3"] }
# Stack high-water-mark measurement for the portable runtime diagnostics capability.
iobewi-esp-runtime = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39", features = ["esp32s3"] }
# ESP implementations of portable IOBEWI platform capabilities.
iobewi-esp-device = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39", features = ["esp32s3"] }
iobewi-esp-entropy = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39", features = ["esp32s3"] }
# RTC-watchdog one-shot reboot adapter for the portable OTA RebootPort capability.
iobewi-esp-reboot = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39", features = ["esp32s3"] }

esp-hal = { version = "~1.1.0", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
smoltcp = { version = "0.13.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"


embassy-sync = "0.8.0"
picoserve    = { version = "0.20.0", features = ["embassy", "alloc"] }
serde        = { version = "1", default-features = false, features = ["derive"] }
serde_json   = { version = "1", default-features = false, features = ["alloc"] }
# Constant-time Bearer token comparison (contrat §1).
subtle       = { version = "2", default-features = false }

# Races the self-check against contrat §3's bounded deadline.
embassy-futures = "0.1"
# Generic isolated configuration spaces and their ESP/NVS backend.
iobewi-config-space = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39" }
iobewi-esp-config-space = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39", package = "iobewi-esp-config-space", features = ["esp32s3"] }
# ESP crypto and networking for the IOBEWI TLS identity service.
iobewi-esp-tls = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39", package = "iobewi-esp-tls", features = ["esp32s3", "picoserve", "service"] }
# TEMPORARY: pinned to iobewi-esp's feat/tls-listener-port branch while
# EspTlsListener::new() is being exposed for portable composition; bump to
# main once it merges.
iobewi-esp-https = { git = "https://github.com/iobewi/iobewi", rev = "df7a3494d4386fd1c7356fadeeda345e9ba82f39", features = ["esp32s3"] }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
