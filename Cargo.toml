[package]
edition      = "2024"
name         = "embewi-agent-esp"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "embewi-agent-esp"
path = "./src/bin/main.rs"

[[bin]]
name = "embewi-init"
path = "./src/bin/init.rs"

[features]
# TEST/DEBUG ONLY -- never enable in a production image. Makes the
# pending_verify self-check reset the device right after it passes but
# BEFORE confirming (`ota.rs`'s `confirm_pending`), deterministically
# exercising embewi-boot's `Pending -> Aborted -> fallback` rollback path
# without needing to time a physical power-cut against a live self-check
# window (which normally completes before Wi-Fi even reconnects).
fault-injection = []
# TEST/DEBUG ONLY -- never enable in a production image. A stronger variant
# of `fault-injection`: instead of a clean `software_reset()` after the
# self-check passes, spins forever right at the top of `confirm_pending`,
# starving the whole (single-threaded) embassy executor before either the
# self-check or its own software deadline ever gets polled again -- the one
# failure a purely software timeout structurally cannot catch, since it
# depends on the same stuck executor. Proves the *hardware* watchdog alone
# forces the eventual reset, with zero cooperation from any of this
# firmware's own code.
fault-injection-freeze = []

[dependencies]
# FiBeWI transactional firmware lifecycle core and ESP backend.
fibewi = { git = "https://github.com/iobewi/fibewi", rev = "13ebee5000d4c7653382cf4e1c7395a3eb74153f" }
# Transport-agnostic Improv Serial codec/parser extracted from this firmware.
# Pinned by commit while its API is still pre-stable.
improv-serial = { git = "https://github.com/iobewi/improv-serial", rev = "8e9d2c4" }
# One process-wide physical flash owner. No NVS or OTA semantics live here.
espbewi-flash = { git = "https://github.com/iobewi/espbewi", rev = "d82000443285c9272d0a6b6c42e3b7175bae068f", package = "espbewi-flash", features = ["esp32s3"] }
espbewi-ota = { git = "https://github.com/iobewi/espbewi", rev = "d82000443285c9272d0a6b6c42e3b7175bae068f", package = "espbewi-ota", features = ["esp32s3"] }
# Reusable Wi-Fi station transport. Credential persistence and application
# service supervision remain local to this firmware.
espbewi-wifi = { git = "https://github.com/iobewi/espbewi", rev = "d82000443285c9272d0a6b6c42e3b7175bae068f", package = "espbewi-wifi", features = ["esp32s3"] }

esp-hal = { version = "~1.1.0", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-hal-smartled2 = "0.29.0"
smart-leds        = "0.4"
smoltcp = { version = "0.13.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
embedded-storage  = "0.3.1"

# No chip feature declared here: it rides on whatever chip esp-hal above is
# built for (Cargo unifies features per resolved crate version), so
# `chip_pretty!()` always matches the active target instead of a hardcoded
# string that could silently go stale, e.g. when switching esp-hal's own
# "esp32c3" feature to "esp32s3".
esp-metadata-generated = "0.4.0"

embassy-sync = "0.8.0"
picoserve    = { version = "0.20.0", features = ["embassy", "alloc"] }
serde        = { version = "1", default-features = false, features = ["derive"] }
serde_json   = { version = "1", default-features = false, features = ["alloc"] }
# Constant-time Bearer token comparison (contrat §1).
subtle       = { version = "2", default-features = false }

# SNTP (contrat §5) -- split into three crates upstream (core protocol,
# embassy-net UDP adapter, embassy-time timestamp generator) so each can be
# versioned independently of the others.
sntpc              = { version = "0.11", default-features = false, features = ["log"] }
sntpc-net-embassy  = { version = "0.11", default-features = false, features = ["log"] }
sntpc-time-embassy = "0.6"

# ESP_LOGx streaming outbound (contrat §5, WebSocket) -- a client-side WS
# handshake+framing stack, not a full HTTP server. Deliberately not
# reusing picoserve's own "ws" feature: that's for handling *inbound*
# upgrade requests, we need the reverse (connecting out to the Core). Only
# `edge_http::ws`'s plain header-building functions are used now (the WS
# handshake runs over a `tls::connect_client` session by hand -- see
# log_stream.rs's doc comment) and `edge_ws` for frame I/O; `edge-nal`/
# `edge-nal-embassy` (the TCP transport `edge_http::io::client::Connection`
# needed) and `reqwless` (heartbeat's old plain-HTTP client, same TLS gap)
# are gone along with that rewrite.
edge-http = { version = "0.8", default-features = false, features = ["io"] }
edge-ws   = { version = "0.8", default-features = false, features = ["io"] }
heapless  = "0.9"
# Parses the WS upgrade response once `log_stream.rs` hand-rolls the
# handshake over a TLS session (see that module's doc comment for why it
# no longer goes through `edge_http::io::client::Connection`). Already in
# the dependency tree transitively (edge-http itself uses it) -- named
# directly here just to be `use`-able.
httparse = { version = "1", default-features = false }

# Races the self-check against contrat §3's bounded deadline.
embassy-futures = "0.1"
sha2 = { version = "0.10", default-features = false }
# Generic isolated configuration spaces and their ESP/NVS backend.
config-space-manager = { git = "https://github.com/iobewi/config-space-manager", rev = "1d4e02ae8d42cb51867a074bc9a54f78894ecf49" }
espbewi-config-space = { git = "https://github.com/iobewi/espbewi", rev = "d82000443285c9272d0a6b6c42e3b7175bae068f", package = "espbewi-config-space", features = ["esp32s3"] }
# ESP HAL + MbedTLS integration extracted from this firmware. Owns the
# hardware RNG adapter, time hooks, PEM validation/config construction,
# Embassy client handshake and picoserve TLS socket. Application NVS/SNTP
# policy remains in src/tls.rs.
espbewi-tls = { git = "https://github.com/iobewi/espbewi", rev = "d82000443285c9272d0a6b6c42e3b7175bae068f", package = "espbewi-tls", features = ["esp32s3", "picoserve"] }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
