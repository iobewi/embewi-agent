[package]
edition      = "2024"
name         = "embewi-agent-esp"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "embewi-agent-esp"
path = "./src/bin/main.rs"

[[bin]]
name = "embewi-init"
path = "./src/bin/init.rs"

[features]
# TEST/DEBUG ONLY -- never enable in a production image. Makes the
# pending_verify self-check reset the device right after it passes but
# BEFORE confirming (`ota.rs`'s `confirm_pending`), deterministically
# exercising embewi-boot's `Pending -> Aborted -> fallback` rollback path
# without needing to time a physical power-cut against a live self-check
# window (which normally completes before Wi-Fi even reconnects).
fault-injection = []
# TEST/DEBUG ONLY -- never enable in a production image. A stronger variant
# of `fault-injection`: instead of a clean `software_reset()` after the
# self-check passes, spins forever right at the top of `confirm_pending`,
# starving the whole (single-threaded) embassy executor before either the
# self-check or its own software deadline ever gets polled again -- the one
# failure a purely software timeout structurally cannot catch, since it
# depends on the same stuck executor. Proves the *hardware* watchdog alone
# forces the eventual reset, with zero cooperation from any of this
# firmware's own code.
fault-injection-freeze = []
# TEST/DEBUG ONLY -- never enable in a production image (S16 hardware gate). Runs a
# self-test of the Workload storage after boot: writes known artifacts to the Workload
# slots, verifies them by SHA-256 read-back, stages one in OTM2, cuts power between the
# artifact write and its staging, and checks recovery after each reset. No HTTP surface,
# no Workload is ever loaded or executed.
workload-selftest = ["dep:sha2"]
# TEST/VALIDATION ONLY (S18): builds a real Workload Supervisor over a minimal *probe*
# runtime (a periodic counter, observable health, and fault injection driven by the
# probe artifact's header). Without it the Agent has no supervisor and activation stays
# 501. The probe is not a Workload ABI and is replaced by the real runtime later.
workload-supervisor-probe = []
# S19: the Supervisor runs real *native* Workloads (separately built IWNI images, loaded into a
# fixed RAM region and executed on the second core). Excludes the probe runtime. Costs 32 KiB of
# the reclaimed heap (reserved for the Workload region) and one pinned core.
workload-native = ["iobewi-esp-workload/native"]
# TEST ONLY (S18): advertises runtime API 0.9, incompatible with Workloads requiring 1.x,
# to exercise the Agent OTA guard (a new Agent that cannot run the active Workload is
# not confirmed).
test-runtime-api-0-9 = []

[dependencies]
# IOBEWI transactional OTA service and ESP backend. Also carries the
# first-install bootstrap lifecycle (`iobewi_ota::bootstrap`) -- no longer a
# separately-pinned alias: the ESP OTA adapter (iobewi-esp-ota) now depends on this
# same rev's bootstrap module itself, so keeping the main engine on an
# older rev would just reintroduce the exact cross-version trait mismatch
# this single dependency avoids.
iobewi-ota = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c", features = ["runtime", "config-space"] }
# The OTA HTTP routes (prepare / streaming write / activate): handlers over firmware/update.
iobewi-ota-http = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }
iobewi-http-server = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }
# Outbound HTTP/1.1 client primitives (heartbeat); no picoserve, no WebSocket feature needed here.
iobewi-http-client = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }
iobewi-tls-service = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }
iobewi-crypto-mbedtls = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }
iobewi-wifi-core = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }
iobewi-wifi-manager = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }
# Local log capture (ring + the single global logger); the WebSocket streaming below sits on top of it.
iobewi-log = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }
iobewi-log-stream = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }
iobewi-ntp = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }
# Low-level connection contracts (Close, Connection, outbound Connector) and
# the secure-outbound-connector guarantee (SecureClientTransport). iobewi-esp-tls
# implements both; heartbeat and log-stream consume them.
iobewi-net-io = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }
iobewi-net-tls-core = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }
# Portable device-status capability (semantic state only, no LED/colour).
iobewi-indicator = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }
# Portable runtime diagnostics capability (stack headroom, etc.).
iobewi-runtime = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }
# Portable platform capabilities consumed by Embewi business logic.
iobewi-device = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }
iobewi-entropy = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }
# Transport-agnostic Improv Serial codec/parser extracted from this firmware.
# Pinned by commit while its API is still pre-stable.
improv-serial = { git = "https://github.com/iobewi/improv-serial", rev = "8e9d2c4" }
# One process-wide physical flash owner. No NVS or OTA semantics live here.
# Pinned alongside https/tls/config-space/log-stream below: all share path
# dependencies inside the iobewi repository (tls->config-space->
# flash, ota->config-space->flash), so every consumer must resolve the same
# rev or Cargo instantiates two structurally-identical-but-incompatible copies.
iobewi-esp-flash = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c", package = "iobewi-esp-flash", features = ["esp32s3"] }
iobewi-esp-ota = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c", package = "iobewi-esp-ota", features = ["esp32s3", "shared-flash"] }
# ESP radio implementation for the portable IOBEWI Wi-Fi service.
iobewi-esp-wifi = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c", package = "iobewi-esp-wifi", features = ["esp32s3"] }
# ESP console sink handed to iobewi_log::install.
iobewi-esp-console = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c", features = ["esp32s3"] }
# ESP RMT/WS2812 renderer for the portable status-indicator capability.
iobewi-esp-indicator = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c", features = ["esp32s3"] }
# Stack high-water-mark measurement for the portable runtime diagnostics capability.
iobewi-esp-runtime = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c", features = ["esp32s3"] }
# ESP implementations of portable IOBEWI platform capabilities.
iobewi-esp-device = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c", features = ["esp32s3"] }
iobewi-esp-entropy = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c", features = ["esp32s3"] }
# Physical SoC reset primitives (software_reset, RTC-watchdog arm_system_reset); the
# orchestrated reboot built on them is src/esp_reboot.rs.
iobewi-workload-ota-http = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }
iobewi-esp-workload = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c", features = ["esp32s3"] }
iobewi-esp-reset = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c", features = ["esp32s3"] }

esp-hal = { version = "~1.1.0", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
smoltcp = { version = "0.13.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"


embassy-sync = "0.8.0"
picoserve    = { version = "0.20.0", features = ["embassy", "alloc"] }
serde        = { version = "1", default-features = false, features = ["derive"] }
serde_json   = { version = "1", default-features = false, features = ["alloc"] }
# Constant-time Bearer token comparison (contrat §1).
subtle       = { version = "2", default-features = false }

# Races the self-check against contrat §3's bounded deadline.
embassy-futures = "0.1"
# Only the `workload-selftest` hardware gate hashes patterns (production images do not link it).
sha2 = { version = "0.10", default-features = false, optional = true }
# Generic isolated configuration spaces and their ESP/NVS backend.
iobewi-config-space = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }
iobewi-esp-config-space = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c", package = "iobewi-esp-config-space", features = ["esp32s3"] }
# ESP crypto and networking for the IOBEWI TLS identity service.
iobewi-esp-tls = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c", package = "iobewi-esp-tls", features = ["esp32s3", "embassy-net"] }
# HTTPS = the HTTP server on iobewi-esp-tls::EspTlsListener (S12: no https crate).
# TLS provisioning routes (/tls/cert, /tls/ca) over the portable TLS service.
iobewi-tls-http = { git = "https://github.com/iobewi/iobewi", rev = "7b912098957ab6f29b0de6aabe027a25f334553c" }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
