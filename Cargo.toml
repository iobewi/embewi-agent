[package]
edition      = "2024"
name         = "embewi-agent-esp"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "embewi-agent-esp"
path = "./src/bin/main.rs"

[[bin]]
name = "embewi-init"
path = "./src/bin/init.rs"

[features]
# TEST/DEBUG ONLY -- never enable in a production image. Makes the
# pending_verify self-check reset the device right after it passes but
# BEFORE confirming (`ota.rs`'s `confirm_pending`), deterministically
# exercising embewi-boot's `Pending -> Aborted -> fallback` rollback path
# without needing to time a physical power-cut against a live self-check
# window (which normally completes before Wi-Fi even reconnects).
fault-injection = []
# TEST/DEBUG ONLY -- never enable in a production image. A stronger variant
# of `fault-injection`: instead of a clean `software_reset()` after the
# self-check passes, spins forever right at the top of `confirm_pending`,
# starving the whole (single-threaded) embassy executor before either the
# self-check or its own software deadline ever gets polled again -- the one
# failure a purely software timeout structurally cannot catch, since it
# depends on the same stuck executor. Proves the *hardware* watchdog alone
# forces the eventual reset, with zero cooperation from any of this
# firmware's own code.
fault-injection-freeze = []

[dependencies]
# IOBEWI transactional OTA service and ESP backend. Also carries the
# first-install bootstrap lifecycle (`iobewi_ota::bootstrap`) -- no longer a
# separately-pinned alias: `iobewi-esp`'s OTA adapter now depends on this
# same rev's bootstrap module itself, so keeping the main engine on an
# older rev would just reintroduce the exact cross-version trait mismatch
# this single dependency avoids.
iobewi-ota = { git = "https://github.com/iobewi/iobewi", rev = "20458f217080bb9e2189a4f5f8177e1f9e3fa64d", features = ["http", "runtime"] }
iobewi-http = { git = "https://github.com/iobewi/iobewi", rev = "fc6bd3cbbeb697e9d72e1fbfda466ad02079ea0c" }
iobewi-tls = { git = "https://github.com/iobewi/iobewi", rev = "fc6bd3cbbeb697e9d72e1fbfda466ad02079ea0c", features = ["http"] }
iobewi-wifi = { git = "https://github.com/iobewi/iobewi", rev = "fc6bd3cbbeb697e9d72e1fbfda466ad02079ea0c" }
iobewi-log-stream = { git = "https://github.com/iobewi/iobewi", rev = "d959db9b4ca581af44c7a380c919227d865b2d49" }
iobewi-ntp = { git = "https://github.com/iobewi/iobewi", rev = "ee21b27fd62617a20ad2e69866dcf3342c3325b4" }
# Portable client-side secure transport capability (DNS/TCP/TLS opaque to
# the caller). TEMPORARY: pinned to iobewi's feat/secure-client-transport
# branch while that chantier is in flight; bump to a main commit once it
# merges.
iobewi-transport = { git = "https://github.com/iobewi/iobewi", rev = "d959db9b4ca581af44c7a380c919227d865b2d49" }
# Portable device-status capability (semantic state only, no LED/colour).
# TEMPORARY: pinned to iobewi's feat/status-indicator branch while that
# chantier is in flight; bump to a main commit once it merges.
iobewi-indicator = { git = "https://github.com/iobewi/iobewi", rev = "283886febc95796169d55049a4e19aca11a55927" }
# Portable runtime diagnostics capability (stack headroom, etc.). TEMPORARY:
# pinned to iobewi's feat/runtime-diagnostics branch while that chantier is
# in flight; bump to a main commit once it merges.
iobewi-runtime = { git = "https://github.com/iobewi/iobewi", rev = "2879366e182ed48c73cdeb5139457f437266f33d" }
# Transport-agnostic Improv Serial codec/parser extracted from this firmware.
# Pinned by commit while its API is still pre-stable.
improv-serial = { git = "https://github.com/iobewi/improv-serial", rev = "8e9d2c4" }
# One process-wide physical flash owner. No NVS or OTA semantics live here.
iobewi-esp-flash = { git = "https://github.com/iobewi/iobewi-esp", rev = "1a667b810c69ff56bf84d76e8da94c46e7ecae17", package = "iobewi-esp-flash", features = ["esp32s3"] }
iobewi-esp-ota = { git = "https://github.com/iobewi/iobewi-esp", rev = "1a667b810c69ff56bf84d76e8da94c46e7ecae17", package = "iobewi-esp-ota", features = ["esp32s3", "shared-flash"] }
# ESP radio implementation for the portable IOBEWI Wi-Fi service.
iobewi-esp-wifi = { git = "https://github.com/iobewi/iobewi-esp", rev = "1a667b810c69ff56bf84d76e8da94c46e7ecae17", package = "iobewi-esp-wifi", features = ["esp32s3"] }
iobewi-esp-log-stream = { git = "https://github.com/iobewi/iobewi-esp", rev = "1a667b810c69ff56bf84d76e8da94c46e7ecae17", features = ["esp32s3"] }
# ESP RMT/WS2812 renderer for the portable status-indicator capability.
iobewi-esp-indicator = { git = "https://github.com/iobewi/iobewi-esp", rev = "1a667b810c69ff56bf84d76e8da94c46e7ecae17", features = ["esp32s3"] }
# Stack high-water-mark measurement for the portable runtime diagnostics capability.
iobewi-esp-runtime = { git = "https://github.com/iobewi/iobewi-esp", rev = "1a667b810c69ff56bf84d76e8da94c46e7ecae17" }

esp-hal = { version = "~1.1.0", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
smoltcp = { version = "0.13.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"

# No chip feature declared here: it rides on whatever chip esp-hal above is
# built for (Cargo unifies features per resolved crate version), so
# `chip_pretty!()` always matches the active target instead of a hardcoded
# string that could silently go stale, e.g. when switching esp-hal's own
# "esp32c3" feature to "esp32s3".
esp-metadata-generated = "0.4.0"

embassy-sync = "0.8.0"
picoserve    = { version = "0.20.0", features = ["embassy", "alloc"] }
serde        = { version = "1", default-features = false, features = ["derive"] }
serde_json   = { version = "1", default-features = false, features = ["alloc"] }
# Constant-time Bearer token comparison (contrat §1).
subtle       = { version = "2", default-features = false }

# Races the self-check against contrat §3's bounded deadline.
embassy-futures = "0.1"
# Generic isolated configuration spaces and their ESP/NVS backend.
iobewi-config-space = { git = "https://github.com/iobewi/iobewi", rev = "fc6bd3cbbeb697e9d72e1fbfda466ad02079ea0c" }
iobewi-esp-config-space = { git = "https://github.com/iobewi/iobewi-esp", rev = "1a667b810c69ff56bf84d76e8da94c46e7ecae17", package = "iobewi-esp-config-space", features = ["esp32s3"] }
# ESP crypto and networking for the IOBEWI TLS identity service.
iobewi-esp-tls = { git = "https://github.com/iobewi/iobewi-esp", rev = "1a667b810c69ff56bf84d76e8da94c46e7ecae17", package = "iobewi-esp-tls", features = ["esp32s3", "picoserve", "service"] }
iobewi-esp-https = { git = "https://github.com/iobewi/iobewi-esp", rev = "1a667b810c69ff56bf84d76e8da94c46e7ecae17", features = ["esp32s3"] }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
