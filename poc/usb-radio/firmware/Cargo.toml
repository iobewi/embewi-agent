[package]
name = "usb-radio-firmware"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
usb-radio-core = { path = "../core" }

embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.0", features = ["dhcpv4", "medium-ethernet", "tcp", "dns"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = { version = "0.6.0", default-features = false }
embedded-io-async = "0.7.0"
embedded-storage = "0.3.1"
reqwless = { version = "0.14.0", default-features = false }
static_cell = "2.1.1"

# Portable IOBEWI crates only (no esp-hal): the POC keeps its own esp-hal 1.2 stack, so
# IOBEWI's ESP adapters (esp-hal =1.1.2) cannot be used; adapters live in this crate.
improv-serial = { git = "https://github.com/iobewi/improv-serial", rev = "8e9d2c437d07cc22fe848ec0493ea3a3c5ecaea3" }
iobewi-config-space = { git = "https://github.com/iobewi/iobewi", rev = "e7d66f4b775c9a7be7588c490d61a62dfaee5da0" }
iobewi-wifi-core = { git = "https://github.com/iobewi/iobewi", rev = "e7d66f4b775c9a7be7588c490d61a62dfaee5da0" }
iobewi-wifi-manager = { git = "https://github.com/iobewi/iobewi", rev = "e7d66f4b775c9a7be7588c490d61a62dfaee5da0" }

esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-hal = { version = "1.2.0", features = [
  "esp32s3",
  "log-04",
  "unstable",
] }
esp-rtos = { version = "0.4.0", features = [
  "esp32s3",
  "embassy",
  "esp-radio",
  "log-04",
] }
esp-radio = { version = "=1.0.0-beta.1", features = [
  "esp32s3",
  "log-04",
  "unstable",
  "wifi",
] }
esp-storage = { version = "0.10.0", default-features = false, features = ["esp32s3"] }
esp-println = { version = "0.18.0", default-features = false, features = [
  "esp32s3",
  "log-04",
  "uart",
] }

[features]
default = []
usb-debug = ["embassy-usb/log"]
